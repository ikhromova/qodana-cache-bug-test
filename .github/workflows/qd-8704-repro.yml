name: QD-8704 Repro — Maven NPE at shutdown

on:
  workflow_dispatch:

jobs:
  pre-fix-apply-fixes:
    name: "2026.1 + --apply-fixes (pre-fix)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run qodana-jvm:2026.1 with --apply-fixes
        run: |
          mkdir -p results && chmod -R a+rwX results
          docker run --rm \
            -v "$PWD:/data/project" \
            -v "$PWD/results:/data/results" \
            -e QODANA_TOKEN="${{ secrets.QODANA_TOKEN }}" \
            jetbrains/qodana-jvm:2026.1 \
            --apply-fixes \
            2>&1 | tee qodana-stdout.log
        continue-on-error: true

      - name: Check for QD-8704 NPE
        if: always()
        run: |
          IDEALOG="results/log/idea.log"
          echo "### QD-8704 NPE check — 2026.1 + --apply-fixes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if grep -q "MavenServerConnectorImpl" qodana-stdout.log 2>/dev/null; then
            echo "**:red_circle: NPE FOUND in Docker stdout!**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B1 -A12 "MavenServerConnectorImpl" qodana-stdout.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          elif [ -f "$IDEALOG" ] && grep -q "MavenServerConnectorImpl" "$IDEALOG"; then
            echo "**:red_circle: NPE FOUND in idea.log!**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B1 -A12 "MavenServerConnectorImpl" "$IDEALOG" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo ":white_check_mark: No MavenServerConnectorImpl NPE found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SEVERE entries" >> $GITHUB_STEP_SUMMARY
          SEVERE_COUNT=$(grep -c "SEVERE" "${IDEALOG}" 2>/dev/null || echo 0)
          echo "idea.log SEVERE count: **${SEVERE_COUNT}**" >> $GITHUB_STEP_SUMMARY
          grep "SEVERE" "${IDEALOG}" 2>/dev/null | head -5 >> $GITHUB_STEP_SUMMARY || true

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Remote process termination timeline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          { grep "Remote process" "${IDEALOG}" 2>/dev/null; \
            grep "IDE SHUTDOWN" "${IDEALOG}" 2>/dev/null; \
            grep "Project.*disposed" "${IDEALOG}" 2>/dev/null | tail -1; } \
            | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-2026.1-apply-fixes
          path: |
            qodana-stdout.log
            results/log/idea.log

  pre-fix-plain:
    name: "2026.1 plain scan (pre-fix)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run qodana-jvm:2026.1 plain scan
        run: |
          mkdir -p results && chmod -R a+rwX results
          docker run --rm \
            -v "$PWD:/data/project" \
            -v "$PWD/results:/data/results" \
            -e QODANA_TOKEN="${{ secrets.QODANA_TOKEN }}" \
            jetbrains/qodana-jvm:2026.1 \
            2>&1 | tee qodana-stdout.log
        continue-on-error: true

      - name: Check for QD-8704 NPE
        if: always()
        run: |
          IDEALOG="results/log/idea.log"
          echo "### QD-8704 NPE check — 2026.1 plain scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if grep -q "MavenServerConnectorImpl" qodana-stdout.log 2>/dev/null; then
            echo "**:red_circle: NPE FOUND in Docker stdout!**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B1 -A12 "MavenServerConnectorImpl" qodana-stdout.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          elif [ -f "$IDEALOG" ] && grep -q "MavenServerConnectorImpl" "$IDEALOG"; then
            echo "**:red_circle: NPE FOUND in idea.log!**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B1 -A12 "MavenServerConnectorImpl" "$IDEALOG" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo ":white_check_mark: No MavenServerConnectorImpl NPE found" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SEVERE entries" >> $GITHUB_STEP_SUMMARY
          SEVERE_COUNT=$(grep -c "SEVERE" "${IDEALOG}" 2>/dev/null || echo 0)
          echo "idea.log SEVERE count: **${SEVERE_COUNT}**" >> $GITHUB_STEP_SUMMARY
          grep "SEVERE" "${IDEALOG}" 2>/dev/null | head -5 >> $GITHUB_STEP_SUMMARY || true

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Remote process termination timeline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          { grep "Remote process" "${IDEALOG}" 2>/dev/null; \
            grep "IDE SHUTDOWN" "${IDEALOG}" 2>/dev/null; \
            grep "Project.*disposed" "${IDEALOG}" 2>/dev/null | tail -1; } \
            | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-2026.1-plain
          path: |
            qodana-stdout.log
            results/log/idea.log
