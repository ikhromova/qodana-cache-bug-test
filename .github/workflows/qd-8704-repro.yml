# QD-8704: MavenServerConnectorImpl NPE at shutdown
# Race condition: Maven process terminated after Application disposed.
# Fix: QDJVM-263.2340 (qodana-jvm:2026.3-nightly or later).
#
# project.open.type=Maven is required when project has both pom.xml and build.gradle (QD-11542).

name: QD-8704 Repro — Maven NPE at shutdown

on:
  workflow_dispatch:
    inputs:
      image_prefx:
        description: 'Pre-fix image tag (default: 2026.1)'
        default: '2026.1'
        required: false
      image_postfix:
        description: 'Post-fix image tag (default: 2026.3-nightly)'
        default: '2026.3-nightly'
        required: false

jobs:
  pre-fix:
    name: "qodana-jvm:${{ github.event.inputs.image_prefx || '2026.1' }} + --apply-fixes (pre-fix)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pre-fix build with --apply-fixes
        run: |
          mkdir -p results && chmod -R a+rwX results
          docker run --rm \
            -v "$PWD:/data/project" \
            -v "$PWD/results:/data/results" \
            -e QODANA_TOKEN="${{ secrets.QODANA_TOKEN }}" \
            "jetbrains/qodana-jvm:${{ github.event.inputs.image_prefx || '2026.1' }}" \
            --apply-fixes \
            --property project.open.type=Maven \
            2>&1 | tee qodana-stdout.log
        continue-on-error: true

      - name: Check for QD-8704 NPE
        if: always()
        run: |
          IDEALOG="results/log/idea.log"
          TAG="${{ github.event.inputs.image_prefx || '2026.1' }}"
          echo "## QD-8704 — pre-fix build (${TAG}) + --apply-fixes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          NPE_FOUND=false
          for F in qodana-stdout.log "${IDEALOG}"; do
            if [ -f "$F" ] && grep -q "MavenServerConnectorImpl" "$F" 2>/dev/null; then
              NPE_FOUND=true
              echo ":red_circle: **BUG REPRODUCED** — MavenServerConnectorImpl NPE in \`${F}\`" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -B2 -A15 "MavenServerConnectorImpl" "$F" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
          [ "$NPE_FOUND" = false ] && echo ":white_check_mark: No NPE this run (race condition — retry if needed)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fixes applied" >> $GITHUB_STEP_SUMMARY
          grep "fixes applied" qodana-stdout.log >> $GITHUB_STEP_SUMMARY || echo "(none)" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Shutdown timeline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "Project.*disposed.*removing|Remote process term|IDE SHUTDOWN" "${IDEALOG}" 2>/dev/null | tail -5 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          SEVERE=$(grep -c "SEVERE" "${IDEALOG}" 2>/dev/null || echo 0)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SEVERE count: **${SEVERE}**" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "logs-pre-fix-${{ github.event.inputs.image_prefx || '2026.1' }}"
          path: |
            qodana-stdout.log
            results/log/idea.log

  post-fix:
    name: "qodana-jvm:${{ github.event.inputs.image_postfix || '2026.3-nightly' }} + --apply-fixes (post-fix)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run post-fix build with --apply-fixes
        run: |
          mkdir -p results && chmod -R a+rwX results
          TAG="${{ github.event.inputs.image_postfix || '2026.3-nightly' }}"
          IMAGE="registry.jetbrains.team/p/sa/containers/qodana-jvm:${TAG}"
          if ! docker pull "$IMAGE" 2>/dev/null; then
            IMAGE="jetbrains/qodana-jvm:${TAG}"
          fi
          docker run --rm \
            -v "$PWD:/data/project" \
            -v "$PWD/results:/data/results" \
            -e QODANA_TOKEN="${{ secrets.QODANA_TOKEN }}" \
            "$IMAGE" \
            --apply-fixes \
            --property project.open.type=Maven \
            2>&1 | tee qodana-stdout.log
        continue-on-error: true

      - name: Check for QD-8704 NPE (should be absent)
        if: always()
        run: |
          IDEALOG="results/log/idea.log"
          TAG="${{ github.event.inputs.image_postfix || '2026.3-nightly' }}"
          echo "## QD-8704 — post-fix build (${TAG}) + --apply-fixes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          NPE_FOUND=false
          for F in qodana-stdout.log "${IDEALOG}"; do
            if [ -f "$F" ] && grep -q "MavenServerConnectorImpl" "$F" 2>/dev/null; then
              NPE_FOUND=true
              echo ":red_circle: **REGRESSION** — NPE still present in post-fix build!" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -B2 -A15 "MavenServerConnectorImpl" "$F" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done
          [ "$NPE_FOUND" = false ] && echo ":white_check_mark: **FIX VERIFIED** — No NPE in post-fix build" >> $GITHUB_STEP_SUMMARY

          SEVERE=$(grep -c "SEVERE" "${IDEALOG}" 2>/dev/null || echo 0)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SEVERE count: **${SEVERE}**" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "logs-post-fix-${{ github.event.inputs.image_postfix || '2026.3-nightly' }}"
          path: |
            qodana-stdout.log
            results/log/idea.log
