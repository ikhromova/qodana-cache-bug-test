name: QD-14035 Bug Reproduction (v2025.3.2 - node20)

on:
  push:
    branches: [ test-QD-14035-node20-bug ]
  workflow_dispatch:

jobs:
  qodana-v2025-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan with v2025.3.2 (uses node20 - deprecated)
        uses: JetBrains/qodana-action@v2025.3.2
        with:
          args: --print-problems --log-level debug
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
