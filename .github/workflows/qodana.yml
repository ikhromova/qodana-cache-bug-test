name: QD-14035 Fix Full (checkout@v6 + qodana-action@v2026.1.0 - all node24)

on:
  push:
    branches: [ test-QD-14035-node24-fix ]
  workflow_dispatch:

jobs:
  qodana-v2026-1-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Qodana Scan with v2026.1.0 (node24)
        uses: JetBrains/qodana-action@v2026.1.0
        with:
          args: --print-problems --log-level debug
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
