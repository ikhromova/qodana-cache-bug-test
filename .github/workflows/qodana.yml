name: QD-14035 Fix Verification (v2026.1.0 - node24)

on:
  push:
    branches: [ test-QD-14035-node24-fix ]
  workflow_dispatch:

jobs:
  qodana-v2026-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan with v2026.1.0 (uses node24 - fixed)
        uses: JetBrains/qodana-action@v2026.1.0
        with:
          args: --print-problems --log-level debug
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
