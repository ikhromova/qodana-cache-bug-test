name: Qodana Native Mode Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Qodana Scan (Native Mode, FIXED @main)
        uses: JetBrains/qodana-action@main
        with:
          args: --linter qodana-jvm-community --within-docker false --print-problems --log-level debug
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
